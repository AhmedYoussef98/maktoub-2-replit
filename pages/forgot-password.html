<!DOCTYPE html>

    <!-- Critical: Inline theme script to prevent FOUC (Flash of Unstyled Content) -->
    <script>
    (function() {
        const STORAGE_KEY = 'theme';
        const DEFAULT_THEME = 'dark';
        let theme = DEFAULT_THEME;

        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved === 'light' || saved === 'dark') {
                theme = saved;
            }
        } catch (e) {
            // localStorage blocked or unavailable
        }

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.add('theme-initializing');

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                requestAnimationFrame(function() {
                    document.documentElement.classList.remove('theme-initializing');
                });
            });
        }
    })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/attached_assets/Favicon/SVG/32x32.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/attached_assets/Favicon/PNG/32x32.png">

    <!-- Tailwind CSS -->

                    </button>
                    <a href="/" class="block">
                        <!-- Dark mode logo (secondary - light colored) -->
                        <img src="/attached_assets/Logo 2/Secondary Logo/Maktoub secondary logo.svg"
                             alt="Maktoub Logo"

                        <!-- Light mode logo (primary - dark colored) -->

                <!-- Headline -->

                    إعادة تعيين كلمة المرور

            </div>

            <!-- Card - Dark Teal Background -->
            <div class="flex flex-col items-center" style="display: flex; padding: 32px 40px; flex-direction: column; align-items: center; gap: 24px; align-self: stretch; border-radius: 8px; background: var(--Maktoub-teal-950, #072C2A); box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.10), 0 1px 2px 0 rgba(0, 0, 0, 0.06);">
                <!-- Reset Password Form -->
                <form id="forgotPasswordForm" class="flex flex-col gap-6" style="align-self: stretch;">
                    <!-- Email Input -->
                    <div class="flex flex-col items-start gap-2">
                        <label for="resetEmail" class="text-start" style="color: var(--Maktoub-White, #FFF); font-family: 'Janna LT'; font-size: 14px; font-style: normal; font-weight: 400; line-height: 20px;">
                            البريد الإلكتروني
                        </label>
                        <input type="email"
                               id="resetEmail"
                               class="w-full rounded-md border font-inter text-right shadow-sm"
                               style="padding: 9px 13px; background: var(--input-bg); border-color: var(--input-border); color: var(--text-primary);"
                               placeholder="you@example.com"
                               required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                            id="resetButton"
                            class="transition-all hover:opacity-90"
                            style="display: flex; padding: 9px 17px; justify-content: center; align-items: center; align-self: stretch; border-radius: 6px; background: var(--Maktoub-Main, #1EA896); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); color: var(--white, #FFF); font-family: 'Janna LT'; font-size: 14px; font-style: normal; font-weight: 700; line-height: 20px;">
                        إرسال رابط إعادة التعيين

                </form>

                <!-- Return to Login Link with Dividers -->
                <div class="flex items-center gap-3" style="align-self: stretch;">
                    <div style="height: 1px; flex: 1 0 0; background: var(--Maktoub-teal-900, #174A46);"></div>
                    <a href="/login.html" class="hover:underline" style="color: var(--Maktoub-Light, #A0ECDC); text-align: center; font-family: 'Janna LT'; font-size: 14px; font-style: normal; font-weight: 400; line-height: 20px;">
                        العودة إلى تسجيل الدخول
                    </a>
                    <div style="height: 1px; flex: 1 0 0; background: var(--Maktoub-teal-900, #174A46);"></div>
                </div>
            </div>
        </div>

    <!-- Footer -->
    <footer class="py-6 bg-transparent">

                © 2025 Maktoub. All rights reserved to SQUAD.
            </p>

    <!-- Scripts - Load in specific order -->
    <!-- Core modules first -->
    <script src="/src/core/config.js" onerror="console.error('❌ Failed to load config.js')"></script>
    <script src="/src/core/constants.js" onerror="console.error('❌ Failed to load constants.js')"></script>
    <script src="/src/core/utils.js" onerror="console.error('❌ Failed to load utils.js')"></script>

    <!-- Development mode (REMOVED FOR PRODUCTION) -->
    <!-- <script src="/src/core/dev-mode.js" onerror="console.error('❌ Failed to load dev-mode.js')"></script> -->

    <!-- Theme Service -->

    <!-- Feature modules -->
    <script src="/src/modules/notifications.js" onerror="console.error('❌ Failed to load notifications.js')"></script>
    <script src="/src/services/auth.js" onerror="console.error('❌ Failed to load auth.js')"></script>

    <script>
        // Handle forgot password form submission
        document.addEventListener('DOMContentLoaded', function() {
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const resetButton = document.getElementById('resetButton');

            if (forgotPasswordForm) {
                forgotPasswordForm.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const email = document.getElementById('resetEmail')?.value;

                    if (!email) {
                        if (typeof notify !== 'undefined') {
                            notify.error('الرجاء إدخال البريد الإلكتروني');
                        } else {
                            alert('الرجاء إدخال البريد الإلكتروني');
                        }
                        return;
                    }

                    // Disable button and show loading state
                    resetButton.disabled = true;
                    const originalText = resetButton.textContent;
                    resetButton.textContent = 'جاري الإرسال...';

                    try {
                        if (typeof AuthService !== 'undefined' && AuthService.forgotPassword) {
                            const result = await AuthService.forgotPassword(email);

                            if (result) {
                                if (typeof notify !== 'undefined') {
                                    notify.success('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
                                } else {
                                    alert('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
                                }
                                // Clear the form
                                document.getElementById('resetEmail').value = '';
                            }
                        } else {
                            console.error('❌ AuthService.forgotPassword not available!');
                            if (typeof notify !== 'undefined') {
                                notify.error('خطأ: نظام إعادة تعيين كلمة المرور غير متوفر');
                            } else {
                                alert('خطأ: نظام إعادة تعيين كلمة المرور غير متوفر');
                            }
                        }
                    } catch (error) {
                        console.error('❌ Error in forgot password:', error);
                        if (typeof notify !== 'undefined') {
                            notify.error('حدث خطأ أثناء إرسال رابط إعادة التعيين');
                        } else {
                            alert('حدث خطأ أثناء إرسال رابط إعادة التعيين');
                        }
                    } finally {
                        // Re-enable button
                        resetButton.disabled = false;
                        resetButton.textContent = originalText;
                    }
                });
                console.log('✅ Forgot password form listener attached');
            } else {
                console.error('❌ Forgot password form not found!');
            }
        });
    </script>
</body>
</html>
