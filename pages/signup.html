<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Maktoub</title>

    <!-- Critical: Inline theme script to prevent FOUC (Flash of Unstyled Content) -->
    <script>
    (function() {
        const STORAGE_KEY = 'theme';
        const DEFAULT_THEME = 'dark';
        let theme = DEFAULT_THEME;

        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved === 'light' || saved === 'dark') {
                theme = saved;
            }
        } catch (e) {
            // localStorage blocked or unavailable
        }

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.add('theme-initializing');

        // Set background immediately to prevent flash (especially for Tailwind pages)
        const darkBg = '#102320';
        const lightBg = '#F3F4F6';
        document.documentElement.style.backgroundColor = theme === 'dark' ? darkBg : lightBg;
        document.body.style.backgroundColor = theme === 'dark' ? darkBg : lightBg;

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                requestAnimationFrame(function() {
                    document.documentElement.classList.remove('theme-initializing');
                    // Remove inline styles after theme CSS takes over
                    document.documentElement.style.backgroundColor = '';
                    document.body.style.backgroundColor = '';
                });
            });
        }
    })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/attached_assets/Favicon/SVG/32x32.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/attached_assets/Favicon/PNG/32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/attached_assets/Favicon/PNG/16x16.png">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/public/css/output.css">

    <!-- Theme CSS -->

    <style>

        .hero-bg {
            background-image: var(--hero-bg-url);
            background-size: auto 100%;
            background-position: left center;
            background-repeat: no-repeat;
            opacity: 0.3;

            width: 1893px;

<body class="min-h-screen flex flex-col font-janna" style="background: var(--bg-auth);">
    <!-- Main Content -->
    <div class="flex-1 flex items-center justify-center px-4 py-16 relative overflow-hidden">
        <!-- Background Pattern -->
        <div class="hero-bg"></div>

        <!-- Content Container -->
        <div class="w-full max-w-md relative z-10">
            <!-- Header -->
            <div class="flex flex-col items-center gap-6 mb-8">
                <!-- Logo -->
                <div class="w-full flex items-center justify-center">
                    <a href="/" class="block">

                             class="h-[35px] w-[151px] logo-dark">
                        <!-- Light mode logo (primary - dark colored) -->
                        <img src="/attached_assets/Logo 2/Primary logo/Maktoub primary logo.svg"
                             alt="Maktoub Logo"
                             class="h-[35px] w-[151px] logo-light">
                    </a>
                </div>

                <!-- Headline -->
                <h1 class="text-3xl font-bold text-center leading-9" style="color: var(--text-primary);">
                    إنشاء حساب جديد
                </h1>
            </div>

            <!-- Card - Dark Teal Background -->
            <div class="rounded-lg shadow-xl p-10 flex flex-col gap-6" style="background: var(--bg-card);">
                <!-- Signup Form -->
                <form id="signupForm" class="flex flex-col gap-6">
                    <!-- Name Input -->
                    <div class="flex flex-col items-end gap-2">
                        <label for="name" class="text-sm font-normal text-right" style="color: var(--text-secondary);">
                            الاسم الكامل
                        </label>
                        <input type="text"
                               id="name"
                               class="w-full rounded-md border font-inter text-right shadow-sm"
                               style="padding: 9px 13px; background: var(--input-bg); border-color: var(--input-border); color: var(--text-primary);"
                               placeholder="أدخل اسمك الكامل"
                               required>
                    </div>

                    <!-- Email Input -->
                    <div class="flex flex-col items-end gap-2">
                        <label for="email" class="text-sm font-normal text-right" style="color: var(--text-secondary);">
                            البريد الإلكتروني
                        </label>
                        <input type="email"
                               id="email"
                               class="w-full rounded-md border font-inter text-right shadow-sm"
                               style="padding: 9px 13px; background: var(--input-bg); border-color: var(--input-border); color: var(--text-primary);"
                               placeholder="you@example.com"
                               required>
                    </div>

                    <!-- Password Input -->
                    <div class="flex flex-col items-end gap-2">
                        <label for="password" class="text-sm font-normal text-right" style="color: var(--text-secondary);">
                            كلمة المرور
                        </label>
                        <input type="password"
                               id="password"
                               class="w-full rounded-md border font-inter text-right shadow-sm"
                               style="padding: 9px 13px; background: var(--input-bg); border-color: var(--input-border); color: var(--text-primary);"
                               placeholder="••••••••"
                               required>
                    </div>

                    <!-- Sign Up Button -->
                    <button type="submit"
                            id="signupButton"
                            class="w-full px-6 py-3 rounded-lg font-medium text-base transition-all hover:opacity-90"
                            style="background: var(--btn-primary-bg); color: var(--btn-primary-text);">
                        إنشاء حساب
                    </button>
                </form>

                <!-- Login Link -->
                <div class="text-center">
                    <span class="text-sm" style="color: var(--text-secondary);">لديك حساب بالفعل؟</span>
                    <a href="/login.html" class="text-sm hover:underline mr-2" style="color: var(--color-primary);">تسجيل الدخول</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 bg-transparent">
        <div class="max-w-6xl mx-auto px-8">
            <p class="text-sm text-center font-inter" style="color: var(--footer-text);">
                © 2025 Maktoub. All rights reserved to SQUAD.
            </p>
        </div>
    </footer>

    <!-- Scripts - Load in specific order -->
    <!-- Core modules first -->
    <script src="/src/core/config.js" onerror="console.error('❌ Failed to load config.js')"></script>
    <script src="/src/core/constants.js" onerror="console.error('❌ Failed to load constants.js')"></script>
    <script src="/src/core/utils.js" onerror="console.error('❌ Failed to load utils.js')"></script>

    <!-- Development mode (REMOVED FOR PRODUCTION) -->
    <!-- <script src="/src/core/dev-mode.js" onerror="console.error('❌ Failed to load dev-mode.js')"></script> -->

    <!-- Theme Service -->
    <script src="/src/services/theme.js" onerror="console.error('❌ Failed to load theme.js')"></script>

    <!-- Feature modules -->
    <script src="/src/modules/notifications.js" onerror="console.error('❌ Failed to load notifications.js')"></script>
    <script src="/src/services/auth.js" onerror="console.error('❌ Failed to load auth.js')"></script>

    <script>
        // Trigger Google Sign-Up when custom button is clicked
        document.addEventListener('DOMContentLoaded', function() {
            const googleSignUpBtn = document.getElementById('googleSignUpBtn');
            if (googleSignUpBtn) {
                googleSignUpBtn.addEventListener('click', function() {
                    console.log('🔍 Google Sign-Up button clicked');
                    // Programmatically trigger Google Sign-In
                    const googleButton = document.querySelector('.g_id_signin');
                    if (googleButton) {
                        googleButton.click();
                    } else {
                        // Fallback: redirect to Google OAuth
                        window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=671992619897-iqr0sbkqkchmf40bejbvlj0dr6f717oh.apps.googleusercontent.com';
                    }
                });
            }
        });
    </script>
</body>
</html>
